name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  schedule:
    - cron: '23 */3 * * *'   # every 3 hours: redeploy with the latest Paper Desk numbers
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      # Pull the newest focus 5 paper book from the live desk. Needs the repository secret
      # BRAINY_API_KEY; without it, or if the desk is unreachable, the committed snapshot ships.
      # The key is only sent to brainy.deepbeta.mn - the exported JSON never contains it.
      - name: Refresh the paper book from the live Paper Desk
        continue-on-error: true
        env:
          BRAINY_API_KEY: ${{ secrets.BRAINY_API_KEY }}
        run: |
          if [ -z "$BRAINY_API_KEY" ]; then
            echo "::notice::BRAINY_API_KEY secret not set - deploying the committed data/focus-book.json"
            exit 0
          fi
          python3 tools/export_focus_book.py --url

      - name: Collect static files
        run: |
          mkdir _site
          cp index.html styles.css script.js CNAME robots.txt sitemap.xml favicon.ico _site/
          cp -r logo _site/logo
          cp -r data _site/data

      # /mn/ and /ko/: index.html with the translations from i18n/*.json baked in, so search
      # engines index all three languages. Fails the deploy if the markup no longer matches.
      - name: Build the Mongolian and Korean pages
        run: python3 tools/build_i18n_pages.py _site

      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
