name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  schedule:
    - cron: '23 */3 * * *'   # every 3 hours: redeploy with the latest Paper Desk numbers
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment_retry.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Pages
        uses: actions/configure-pages@v6
        with:
          enablement: true

      # Pull the newest focus 5 paper book from the live desk. Needs the repository secret
      # BRAINY_API_KEY; without it, or if the desk is unreachable, the committed snapshot ships.
      # The key is only sent to brainy.deepbeta.mn - the exported JSON never contains it.
      - name: Refresh the paper book from the live Paper Desk
        continue-on-error: true
        env:
          BRAINY_API_KEY: ${{ secrets.BRAINY_API_KEY }}
        run: |
          if [ -z "$BRAINY_API_KEY" ]; then
            echo "::notice::BRAINY_API_KEY secret not set - deploying the committed data/focus-book.json"
            exit 0
          fi
          python3 tools/export_focus_book.py --url

      # the English pages (keep this list in step with PAGES in tools/build_i18n_pages.py)
      - name: Collect static files
        run: |
          mkdir _site
          cp index.html styles.css script.js CNAME robots.txt sitemap.xml favicon.ico _site/
          for page in technology results platform; do
            mkdir -p "_site/$page" && cp "$page/index.html" "_site/$page/"
          done
          cp -r logo _site/logo
          cp -r data _site/data

      # /mn/… and /ko/…: every English page with the translations from i18n/*.json baked in, so
      # search engines index all three languages. Fails the deploy if the markup no longer matches,
      # or if the header or footer differs between pages.
      - name: Build the Mongolian and Korean pages
        run: python3 tools/build_i18n_pages.py _site

      - name: Upload static site
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      # The deploy step finds the upload through the API. Right after the upload it is sometimes
      # not listed yet, which used to fail the run ("No artifacts named github-pages were found").
      # So: one attempt, and if that fails, a short wait and a second attempt. The job fails only
      # if both do.
      - name: Deploy to GitHub Pages
        id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v5

      - name: Wait before the second attempt
        if: steps.deployment.outcome == 'failure'
        run: sleep 30

      - name: Deploy to GitHub Pages (second attempt)
        id: deployment_retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v5
